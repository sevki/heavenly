[package]
name = "heavenly-id"
version.workspace = true
description = "Stable location identities, aliases and a frame-building registry for heavenly"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://sevki.github.io/heavenly/api/heavenly_id/"
rust-version.workspace = true

[features]
default = ["std"]
std = ["heavenly-core/std", "heavenly-geo/std"]

[dependencies]
heavenly-core = { version = "0.6.0", path = "../heavenly-core", default-features = false, features = ["alloc"] }
heavenly-geo = { version = "0.6.0", path = "../heavenly-geo", default-features = false, features = ["alloc"] }
libm = "0.2"

[dev-dependencies]
heavenly-orbit = { path = "../heavenly-orbit" }
