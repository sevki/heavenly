name: Reference data

# Regenerates heavenly-geo's SOFA/SPICE reference values and fails if they
# differ from what is committed, so the fixtures stay reproducible.
on:
  pull_request:
    paths:
      - "heavenly-geo/tests/reference/**"
      - ".github/workflows/reference.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyerfa==2.0.1.5 spiceypy==8.4.0
      - name: Download NAIF kernels
        run: |
          mkdir -p kernels
          curl -fsSL -o kernels/pck00011.tpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
          curl -fsSL -o kernels/naif0012.tls https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - run: python3 heavenly-geo/tests/reference/generate.py kernels > heavenly-geo/tests/reference/data.rs
      - run: git diff --exit-code -- heavenly-geo/tests/reference/data.rs
