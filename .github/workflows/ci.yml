name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p heavenly -p heavenly-core -p heavenly-geo -p heavenly-spice -p heavenly-orbit -p heavenly-id -p heavenly-query -p heavenly-topology --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x64, os: ubuntu-24.04 }
          - { name: linux arm64, os: ubuntu-24.04-arm }
          - { name: macos arm64, os: macos-15 }
          - { name: macos x64, os: macos-15-intel }
          - { name: windows x64, os: windows-2025 }
          - { name: windows arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # The batch operations must match the single-item ones bit for bit on
      # every SIMD path: here AVX2 on x86_64 (the arm64 runners use NEON).
      - name: Batch parity with AVX2
        if: runner.arch == 'X64'
        run: cargo test -p heavenly-core --test batch
        env:
          RUSTFLAGS: -D warnings -C target-cpu=x86-64-v3
      - run: cargo test -p heavenly-core -p heavenly-geo -p heavenly-orbit -p heavenly-query --no-default-features --features alloc

  msrv:
    name: MSRV (1.70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - uses: Swatinem/rust-cache@v2
      # Default features: the optional `jetstream` feature needs a newer
      # toolchain than the library's MSRV.
      - run: cargo test --workspace --locked

  no_std:
    name: no_std (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p heavenly-core -p heavenly-geo -p heavenly-orbit --no-default-features --target ${{ matrix.target }}
      - run: cargo build -p heavenly-core -p heavenly-geo -p heavenly-orbit --no-default-features --features alloc --target ${{ matrix.target }}
      - name: SIMD without std
        run: cargo build -p heavenly-core --no-default-features --features alloc,simd --target ${{ matrix.target }}
      - run: cargo build -p heavenly-spice -p heavenly-id -p heavenly-query -p heavenly-topology --no-default-features --target ${{ matrix.target }}
      - name: The heavenly crate without a heap, and with every module
        run: |
          cargo build -p heavenly --no-default-features --features geo,orbit,query --target ${{ matrix.target }}
          cargo build -p heavenly --no-default-features --features alloc,geo,spice,orbit,id,query,topology --target ${{ matrix.target }}

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run every example
        shell: bash
        run: |
          set -euo pipefail
          for f in */examples/*.rs; do
            crate=$(dirname "$(dirname "$f")")
            name=$(basename "$f" .rs)
            echo "::group::$crate/$name"
            cargo run -p "$crate" --example "$name"
            echo "::endgroup::"
          done

  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Without std or a heap (core modules)
        run: cargo build -p heavenly --target wasm32-unknown-unknown --no-default-features --features geo,orbit,query
      - name: With a heap, every no_std module
        run: cargo build -p heavenly --target wasm32-unknown-unknown --no-default-features --features alloc,geo,orbit,query,spice,id,topology
      - name: With std and every module (the default)
        run: cargo build -p heavenly --target wasm32-unknown-unknown
      - name: Every crate's tests and examples compile
        run: cargo test --workspace --exclude heavenly-viz --exclude heavenly-diagrams --target wasm32-unknown-unknown --no-run

  wasm-pack:
    name: wasm-pack (conformance in Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The SOFA, SPICE, Vallado SGP4 and Skyfield checks, compiled to
      # wasm32-unknown-unknown and run with wasm-bindgen-test.
      - run: wasm-pack test --node heavenly --test conformance
      - name: The same, with WebAssembly SIMD (simd128)
        run: wasm-pack test --node heavenly --test conformance
        env:
          RUSTFLAGS: -D warnings -C target-feature=+simd128

  conformance:
    name: conformance
    uses: ./.github/workflows/conformance.yml

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  book:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the playground's WebAssembly module
        run: book/build-playground.sh
      - name: The module must not need JavaScript imports
        run: node -e "const m=new WebAssembly.Module(require('fs').readFileSync('book/src/playground/heavenly_viz.wasm'));if(WebAssembly.Module.imports(m).length)throw new Error(JSON.stringify(WebAssembly.Module.imports(m)))"
      - run: mdbook build book
      - name: Every diagram directive was expanded
        # A skipped preprocessor leaves the directive alone on its line; the
        # escaped example in the contributing guide is inside <code>.
        run: "! grep -rlE '^[{][{]#heavenly-diagram' book/book --include='*.html'"
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/book
          retention-days: 7
