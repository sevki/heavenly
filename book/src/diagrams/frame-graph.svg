<line x1="90.0" y1="398.0" x2="90.0" y2="344.0" class="hv-frames-sac2" stroke-dasharray="5 4"/>
<rect x="100.0" y="278.0" width="210.0" height="24.0" rx="6" class="hv-frames-smu" fill="none" stroke-dasharray="5 4"/>
