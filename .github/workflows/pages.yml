name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the playground (wasm-pack, then Vite)
        run: book/build-playground.sh
      - name: Build book
        run: mdbook build book
      - name: Every diagram directive was expanded
        # A skipped preprocessor leaves the directive alone on its line; the
        # escaped example in the contributing guide is inside <code>.
        run: "! grep -rlE '^[{][{]#heavenly-diagram' book/book --include='*.html'"
      - name: Build API docs into the book
        run: |
          cargo doc --workspace --no-deps --all-features
          cp -r target/doc book/book/api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
