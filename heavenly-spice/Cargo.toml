[package]
name = "heavenly-spice"
version.workspace = true
description = "Reader for SPICE SPK and binary PCK kernels (JPL DE ephemerides) for heavenly"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://sevki.github.io/heavenly/api/heavenly_spice/"
rust-version.workspace = true

[features]
default = ["std"]
# Enables `Spk::open` / `Pck::open` from a file path.
std = ["heavenly-core/std"]

[dependencies]
heavenly-core = { version = "0.8.0", path = "../heavenly-core", default-features = false, features = ["alloc"] }
libm = "0.2"

