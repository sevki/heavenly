<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" class="hv-diagram" role="img" aria-labelledby="hv-frames-title">
<title id="hv-frames-title">Frame graph for the Earth–Moon example</title>
<style>.hv-frames-sfg{stroke:currentColor;stroke-width:1.5}.hv-frames-sac{stroke:var(--links,#1f6feb);stroke-width:2}.hv-frames-sac2{stroke:#e8590c;stroke-width:2}.hv-frames-smu{stroke:var(--icons,#888);stroke-width:1}.hv-frames-ffg{fill:currentColor}.hv-frames-fac{fill:var(--links,#1f6feb)}.hv-frames-fac2{fill:#e8590c}.hv-frames-fmu{fill:var(--icons,#888)}.hv-frames-tfg{fill:currentColor}.hv-frames-tac{fill:var(--links,#1f6feb)}.hv-frames-tac2{fill:#e8590c}.hv-frames-tmu{fill:var(--icons,#888)}.hv-frames-bgfg{fill:var(--quote-bg,rgba(127,127,127,.12))}.hv-frames-bgac{fill:var(--quote-bg,rgba(127,127,127,.12))}.hv-frames-bgac2{fill:rgba(232,89,12,.12)}.hv-frames-bgmu{fill:rgba(127,127,127,.22)}.hv-frames-mono{font-family:var(--mono-font,monospace)}</style>
