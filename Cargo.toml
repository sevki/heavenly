[workspace]
resolver = "2"
members = ["heavenly", "heavenly-core", "heavenly-geo", "heavenly-spice", "heavenly-orbit", "heavenly-id", "heavenly-query", "heavenly-topology", "diagrams", "viz"]

[workspace.package]
# One minor version per milestone: M1 = 0.1, M2 = 0.2, M3 = 0.3, ...
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sevki/heavenly"
homepage = "https://sevki.github.io/heavenly/"
rust-version = "1.70"

# Size-optimised build for the book's WebAssembly playground:
#   cargo build -p heavenly-viz --profile wasm --target wasm32-unknown-unknown
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
