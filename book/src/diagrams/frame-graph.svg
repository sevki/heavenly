<line x1="202.4" y1="278.0" x2="173.1" y2="144.0" class="hv-frames-sac2" stroke-dasharray="5 4"/>
<rect x="515.0" y="28.0" width="150.0" height="24.0" rx="6" class="hv-frames-smu" fill="none" stroke-dasharray="5 4"/>
