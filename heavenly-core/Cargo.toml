[package]
name = "heavenly-core"
version.workspace = true
description = "Frames, epochs, state vectors and transforms for the heavenly coordinate library"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://sevki.github.io/heavenly/api/heavenly_core/"
rust-version.workspace = true

[features]
default = ["std"]
# Enables `std::error::Error` impls. Implies `alloc`.
std = ["alloc"]
# Enables the heap-backed `FrameGraph` resolver.
alloc = []

[dependencies]
libm = "0.2"
