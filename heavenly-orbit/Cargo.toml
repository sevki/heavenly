[package]
name = "heavenly-orbit"
version.workspace = true
description = "Two-body propagation, orbital elements and sampled trajectories for heavenly"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://sevki.github.io/heavenly/api/heavenly_orbit/"
rust-version.workspace = true

[features]
default = ["std"]
std = ["alloc", "heavenly-core/std"]
# Enables `SampledTrajectory`.
alloc = ["heavenly-core/alloc"]

[dependencies]
heavenly-core = { version = "0.6.0", path = "../heavenly-core", default-features = false }
libm = "0.2"

