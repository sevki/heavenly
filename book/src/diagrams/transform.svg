<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" class="hv-diagram" role="img" aria-labelledby="hv-transform-title">
<title id="hv-transform-title">Transform from frame A to frame B</title>
<style>.hv-transform-sfg{stroke:currentColor;stroke-width:1.5}.hv-transform-sac{stroke:var(--links,#1f6feb);stroke-width:2}.hv-transform-sac2{stroke:#e8590c;stroke-width:2}.hv-transform-smu{stroke:var(--icons,#888);stroke-width:1}.hv-transform-ffg{fill:currentColor}.hv-transform-fac{fill:var(--links,#1f6feb)}.hv-transform-fac2{fill:#e8590c}.hv-transform-fmu{fill:var(--icons,#888)}.hv-transform-tfg{fill:currentColor}.hv-transform-tac{fill:var(--links,#1f6feb)}.hv-transform-tac2{fill:#e8590c}.hv-transform-tmu{fill:var(--icons,#888)}.hv-transform-bgfg{fill:var(--quote-bg,rgba(127,127,127,.12))}.hv-transform-bgac{fill:var(--quote-bg,rgba(127,127,127,.12))}.hv-transform-bgac2{fill:rgba(232,89,12,.12)}.hv-transform-bgmu{fill:rgba(127,127,127,.22)}.hv-transform-mono{font-family:var(--mono-font,monospace)}</style>
<defs><marker id="hv-transform-arrow-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hv-transform-ffg"/></marker><marker id="hv-transform-arrow-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hv-transform-fac"/></marker><marker id="hv-transform-arrow-ac2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hv-transform-fac2"/></marker><marker id="hv-transform-arrow-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hv-transform-fmu"/></marker></defs>
<line x1="110.0" y1="270.0" x2="220.0" y2="270.0" class="hv-transform-sfg" marker-end="url(#hv-transform-arrow-fg)"/>
<line x1="110.0" y1="270.0" x2="110.0" y2="160.0" class="hv-transform-sfg" marker-end="url(#hv-transform-arrow-fg)"/>
<text x="224.0" y="274.0" text-anchor="start" font-size="13" class="hv-transform-tfg">x_B</text>
<text x="106.0" y="156.0" text-anchor="end" font-size="13" class="hv-transform-tfg">y_B</text>
<text x="104.0" y="286.0" text-anchor="end" font-size="14" class="hv-transform-tfg">B</text>
<line x1="360.0" y1="170.0" x2="446.1" y2="129.9" class="hv-transform-sac" marker-end="url(#hv-transform-arrow-ac)"/>
<line x1="360.0" y1="170.0" x2="319.9" y2="83.9" class="hv-transform-sac" marker-end="url(#hv-transform-arrow-ac)"/>
<text x="450.1" y="133.9" text-anchor="start" font-size="13" class="hv-transform-tac">x_A</text>
<text x="315.9" y="83.9" text-anchor="end" font-size="13" class="hv-transform-tac">y_A</text>
<text x="390.0" y="192.0" text-anchor="start" font-size="14" class="hv-transform-tac">A</text>
<line x1="360.0" y1="170.0" x2="430.0" y2="170.0" class="hv-transform-smu" stroke-dasharray="5 4"/>
<path d="M415.0,170.0 L414.8,165.2 L414.2,160.4 L413.1,155.8 L411.7,151.2 L409.8,146.8" class="hv-transform-smu" fill="none" stroke-width="1.2"/>
<text x="420.0" y="162.0" text-anchor="start" font-size="13" class="hv-transform-tmu">R</text>
<path d="M341.1,158.7 L339.9,161.1 L338.9,163.7 L338.3,166.5 L338.0,169.2 L338.1,172.0 L338.5,174.8 L339.3,177.4 L340.4,180.0 L341.8,182.4 L343.5,184.6 L345.5,186.6 L347.7,188.3 L350.1,189.7 L352.7,190.7 L355.4,191.5" class="hv-transform-sac2" fill="none" stroke-width="1.6"/>
<line x1="352.7" y1="190.7" x2="355.4" y2="191.5" class="hv-transform-sac2" marker-end="url(#hv-transform-arrow-ac2)"/>
<text x="330.0" y="180.0" text-anchor="end" font-size="14" class="hv-transform-tac2">ω</text>
<line x1="360.0" y1="170.0" x2="380.0" y2="230.0" class="hv-transform-sac2" marker-end="url(#hv-transform-arrow-ac2)"/>
<text x="384.0" y="236.0" text-anchor="start" font-size="14" class="hv-transform-tac2">ṫ</text>
<line x1="110.0" y1="270.0" x2="356.0" y2="172.0" class="hv-transform-sfg" marker-end="url(#hv-transform-arrow-fg)"/>
<text x="241.0" y="240.0" text-anchor="start" font-size="14" class="hv-transform-tfg">t</text>
<line x1="360.0" y1="170.0" x2="520.0" y2="70.0" class="hv-transform-sac" marker-end="url(#hv-transform-arrow-ac)"/>
<text x="430.0" y="114.0" text-anchor="end" font-size="13" class="hv-transform-tac">p_A</text>
<line x1="110.0" y1="270.0" x2="520.0" y2="70.0" class="hv-transform-smu" marker-end="url(#hv-transform-arrow-mu)"/>
<text x="305.0" y="162.0" text-anchor="end" font-size="13" class="hv-transform-tmu">p_B</text>
<circle cx="520.0" cy="70.0" r="4" class="hv-transform-ffg"/>
<text x="528.0" y="66.0" text-anchor="start" font-size="12" class="hv-transform-tfg">point</text>
<text x="420.0" y="290.0" text-anchor="start" font-size="14" class="hv-transform-tfg">p_B = R p_A + t</text>
<text x="420.0" y="312.0" text-anchor="start" font-size="14" class="hv-transform-tfg">v_B = R v_A + ω × (R p_A) + ṫ</text>
<text x="20.0" y="22.0" text-anchor="start" font-size="12" class="hv-transform-tmu">all four quantities (R, t, ṫ, ω) are expressed along B's axes</text>
</svg>
