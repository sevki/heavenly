[book]
title = "Heavenly"
description = "A universal spatiotemporal coordinate library for Rust"
authors = ["The heavenly contributors"]
language = "en"
src = "src"

[build]
create-missing = false

# Draws the diagrams ({{#heavenly-diagram NAME}}) with the heavenly crates at
# build time; see diagrams/src/main.rs.
[preprocessor.heavenly]
command = "cargo run --quiet --locked -p heavenly-diagrams --"

[output.html]
additional-css = ["theme/heavenly.css"]
git-repository-url = "https://github.com/sevki/heavenly"
edit-url-template = "https://github.com/sevki/heavenly/edit/main/book/{path}"
