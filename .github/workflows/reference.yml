name: Reference data

# Regenerates the SOFA/SPICE reference values (and heavenly-spice's synthetic
# kernels) and fails if they differ from what is committed, so the fixtures
# stay reproducible.
on:
  pull_request:
    paths:
      - "heavenly-geo/tests/reference/**"
      - "heavenly-spice/tests/reference/**"
      - "heavenly-spice/tests/data/**"
      - "heavenly-orbit/tests/reference/**"
      - ".github/workflows/reference.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyerfa==2.0.1.5 spiceypy==8.4.0 numpy
      - name: Download NAIF kernels
        run: |
          mkdir -p kernels
          curl -fsSL -o kernels/pck00011.tpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
          curl -fsSL -o kernels/naif0012.tls https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          curl -fsSL -o kernels/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
          curl -fsSL -o kernels/moon_pa_de440_200625.bpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/moon_pa_de440_200625.bpc
          curl -fsSL -o kernels/moon_de440_250416.tf https://naif.jpl.nasa.gov/pub/naif/generic_kernels/fk/satellites/moon_de440_250416.tf
      - run: python3 heavenly-geo/tests/reference/generate.py kernels > heavenly-geo/tests/reference/data.rs
      - run: python3 heavenly-spice/tests/reference/generate.py kernels > heavenly-spice/tests/reference/data.rs
      - run: python3 heavenly-orbit/tests/reference/generate.py > heavenly-orbit/tests/reference/data.rs
      - run: git diff --exit-code -- heavenly-geo/tests/reference heavenly-spice/tests heavenly-orbit/tests/reference
