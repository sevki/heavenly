<line x1="515.0" y1="40.0" x2="400.0" y2="40.0" class="hv-frames-sac2" stroke-dasharray="5 4"/>
<text x="10.0" y="462.0" text-anchor="start" font-size="11" class="hv-frames-tmu">boxes: frames · arrows: child → parent edges, labelled with the crate that supplies them</text>
